name: build-teleport-oss

# Costruisce Teleport dal sorgente AGPL di gravitational/teleport al tag indicato,
# senza il sottomodulo Enterprise (e/). Il binario risultante e' AGPL-3.0:
# la licenza "Community Edition" copre solo i binari pubblicati da Gravitational.
# Poi prova che il backend Postgres (quello che serve all'HA) funzioni nella build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag upstream (es. v18.10.0)"
        required: true
        default: "v18.10.0"
      release:
        description: "Pubblica una GitHub Release firmata"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TAG: ${{ inputs.tag }}
      OS: linux
      ARCH: amd64
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teleport
          POSTGRES_PASSWORD: teleport
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teleport"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout upstream al tag (senza sottomoduli)
        uses: actions/checkout@v4
        with:
          repository: gravitational/teleport
          ref: ${{ inputs.tag }}
          path: teleport
          submodules: false
          fetch-depth: 1

      - name: Verifica licenza del sorgente e assenza di e/
        working-directory: teleport
        run: |
          head -3 LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          test ! -f e/Makefile
          grep -E '^VERSION=' Makefile
          echo "Sorgente AGPL, sottomodulo Enterprise assente."

      - name: Go (versione da go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: teleport/go.mod
          cache-dependency-path: teleport/go.sum

      - name: Node 24 + pnpm (da packageManager)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: corepack
        working-directory: teleport
        run: |
          npm i -g corepack@latest
          corepack enable
          pnpm --version

      - name: Rust (da rust-toolchain.toml) + wasm32
        working-directory: teleport
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo --version

      - name: Pacchetti di sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config

      - name: make release (OSS, senza FIDO2/PIV)
        working-directory: teleport
        run: |
          make release OS=$OS ARCH=$ARCH FIDO2=no PIV=no 2>&1 | tail -n 200
          ls -la *.tar.gz

      - name: Ricostruisci l'archivio con la LICENSE AGPL
        working-directory: teleport
        run: |
          set -e
          SRC="teleport-${TAG}-${OS}-${ARCH}-bin.tar.gz"
          rm -rf pkg && mkdir pkg && tar -xzf "$SRC" -C pkg
          rm -f pkg/teleport/LICENSE-community
          cp LICENSE pkg/teleport/LICENSE
          OUT="teleport-${TAG}-ss4i-${OS}-${ARCH}-bin.tar.gz"
          tar -czf "../$OUT" -C pkg teleport
          cd .. && sha256sum "$OUT" | tee "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Il binario si presenta
        run: |
          ./teleport/build/teleport version
          ./teleport/build/tctl version
          ./teleport/build/teleport version | grep -q "Enterprise" && { echo "ERRORE: build Enterprise"; exit 1; } || echo "Build OSS."

      - name: Prova HA — auth con backend Postgres (stato e audit)
        run: |
          set -e
          mkdir -p /tmp/td/sessions
          cat > /tmp/teleport.yaml <<'YAML'
          version: v3
          teleport:
            nodename: smoke
            data_dir: /tmp/td
            log:
              output: stderr
              severity: INFO
            storage:
              type: postgresql
              conn_string: postgresql://teleport:teleport@localhost:5432/teleport_backend?sslmode=disable
              audit_events_uri: ['postgresql://teleport:teleport@localhost:5432/teleport_audit?sslmode=disable']
              audit_sessions_uri: 'file:///tmp/td/sessions'
          auth_service:
            enabled: yes
            cluster_name: smoke
            listen_addr: 127.0.0.1:3025
          proxy_service:
            enabled: no
          ssh_service:
            enabled: no
          YAML
          ./teleport/build/teleport start -c /tmp/teleport.yaml > /tmp/teleport.log 2>&1 &
          for i in $(seq 1 60); do
            if ./teleport/build/tctl -c /tmp/teleport.yaml status >/tmp/status.txt 2>&1; then break; fi
            sleep 3
          done
          cat /tmp/status.txt
          grep -q "Cluster.*smoke" /tmp/status.txt
          ./teleport/build/tctl -c /tmp/teleport.yaml get cluster_auth_preference | head -20
          sudo apt-get install -y -qq postgresql-client >/dev/null
          echo "--- tabelle nel backend Postgres"
          PGPASSWORD=teleport psql -h localhost -U teleport -d teleport_backend -c '\dt'
          PGPASSWORD=teleport psql -h localhost -U teleport -d teleport_backend -c 'select count(*) as chiavi from kv'
          echo "--- tabelle audit"
          PGPASSWORD=teleport psql -h localhost -U teleport -d teleport_audit -c '\dt'
          pkill -f "teleport start" || true
          echo "Backend Postgres e audit Postgres funzionano nella build OSS."

      - name: Log di teleport (sempre)
        if: always()
        run: tail -n 80 /tmp/teleport.log || true

      - name: Artefatti
        uses: actions/upload-artifact@v4
        with:
          name: teleport-${{ inputs.tag }}-ss4i-linux-amd64
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          if-no-files-found: error

      - name: cosign
        if: ${{ inputs.release }}
        uses: sigstore/cosign-installer@v3
      - name: Firma (keyless, OIDC di GitHub)
        if: ${{ inputs.release }}
        run: cosign sign-blob --yes --bundle "${OUT}.sigstore.json" "${OUT}"

      - name: Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}-ss4i.${{ github.run_number }}
          name: Teleport ${{ inputs.tag }} (build AGPL SS4I, run ${{ github.run_number }})
          body: |
            Build dal sorgente AGPL-3.0 di `gravitational/teleport` al tag `${{ inputs.tag }}`, senza sottomodulo Enterprise, con `FIDO2=no PIV=no`.
            Verificato nello stesso run: `teleport version` non Enterprise; auth avviato con backend Postgres (stato) e audit su Postgres.
            Firma: `cosign verify-blob --bundle <file>.sigstore.json --certificate-identity-regexp 'github.com/ss4i/teleport-oss-build' --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>`
          files: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
            ${{ env.OUT }}.sigstore.json
