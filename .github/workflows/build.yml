name: build-teleport-oss

# Costruisce Teleport dal sorgente AGPL di gravitational/teleport al tag indicato,
# senza il sottomodulo Enterprise (e/). Il binario risultante e' AGPL-3.0:
# la licenza "Community Edition" copre solo i binari pubblicati da Gravitational.
# Poi prova che il backend Postgres (quello che serve all'HA) funzioni nella build.
#
# Tre job: build (lento, ~40 min) -> prova-ha (riusa l'artefatto) -> release.
# Per ripetere solo la prova su una build gia' fatta: input build_run_id.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag upstream (es. v18.10.0)"
        required: true
        default: "v18.10.0"
      release:
        description: "Pubblica una GitHub Release firmata"
        type: boolean
        default: true
      build_run_id:
        description: "Facoltativo: id di un run precedente da cui prendere l'artefatto (salta la build)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  actions: read

env:
  TAG: ${{ inputs.tag }}
  OS: linux
  ARCH: amd64

jobs:
  build:
    if: ${{ inputs.build_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout upstream al tag (senza sottomoduli)
        uses: actions/checkout@v4
        with:
          repository: gravitational/teleport
          ref: ${{ inputs.tag }}
          path: teleport
          submodules: false
          fetch-depth: 1

      - name: Verifica licenza del sorgente e assenza di e/
        working-directory: teleport
        run: |
          head -3 LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          test ! -f e/Makefile
          grep -E '^VERSION=' Makefile
          echo "Sorgente AGPL, sottomodulo Enterprise assente."

      - name: Go (versione da go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: teleport/go.mod
          cache-dependency-path: teleport/go.sum

      - name: Node 24 + pnpm (da packageManager)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: corepack
        working-directory: teleport
        run: |
          npm i -g corepack@latest
          corepack enable
          pnpm --version

      - name: Rust (da rust-toolchain.toml) + wasm32
        working-directory: teleport
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo --version

      - name: Pacchetti di sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config

      - name: make release (OSS, senza FIDO2/PIV)
        working-directory: teleport
        run: |
          make release OS=$OS ARCH=$ARCH FIDO2=no PIV=no 2>&1 | tail -n 200
          ls -la *.tar.gz

      - name: Ricostruisci l'archivio con la LICENSE AGPL
        working-directory: teleport
        run: |
          set -e
          SRC="teleport-${TAG}-${OS}-${ARCH}-bin.tar.gz"
          rm -rf pkg && mkdir pkg && tar -xzf "$SRC" -C pkg
          rm -f pkg/teleport/LICENSE-community
          cp LICENSE pkg/teleport/LICENSE
          OUT="teleport-${TAG}-ss4i-${OS}-${ARCH}-bin.tar.gz"
          tar -czf "../$OUT" -C pkg teleport
          cd .. && sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Il binario si presenta
        run: |
          ./teleport/build/teleport version
          ./teleport/build/tctl version
          if ./teleport/build/teleport version | grep -q "Enterprise"; then echo "ERRORE: build Enterprise"; exit 1; fi
          echo "Build OSS."

      - name: Artefatto (subito, prima di qualunque prova)
        uses: actions/upload-artifact@v4
        with:
          name: teleport-bin
          path: |
            teleport-${{ inputs.tag }}-ss4i-linux-amd64-bin.tar.gz
            teleport-${{ inputs.tag }}-ss4i-linux-amd64-bin.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  prova-ha:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.build_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Scarica l'artefatto (da questo run)
        if: ${{ inputs.build_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: teleport-bin
      - name: Scarica l'artefatto (da un run precedente)
        if: ${{ inputs.build_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: teleport-bin
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Verifica sha256 ed estrai
        run: |
          set -e
          sha256sum -c teleport-${TAG}-ss4i-${OS}-${ARCH}-bin.tar.gz.sha256
          tar -xzf teleport-${TAG}-ss4i-${OS}-${ARCH}-bin.tar.gz
          ./teleport/teleport version
          head -2 teleport/LICENSE
          test ! -f teleport/LICENSE-community

      - name: Postgres 16 con wal2json e wal_level=logical
        run: |
          set -e
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=teleport -e POSTGRES_PASSWORD=teleport -e POSTGRES_DB=postgres \
            postgres:16-bookworm -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10 \
            -c output_plugin_libraries=pgoutput,test_decoding,wal2json
          # Dalle minori recenti Postgres ammette come plugin di uscita solo quelli in
          # output_plugin_libraries (default: pgoutput, test_decoding). Teleport usa wal2json.
          for i in $(seq 1 30); do docker exec pg pg_isready -U teleport && break; sleep 2; done
          docker exec pg bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-wal2json >/dev/null'
          docker exec pg psql -U teleport -d postgres -tAc "select version()"
          docker exec pg psql -U teleport -d postgres -tAc "show wal_level"
          docker exec pg psql -U teleport -d postgres -tAc "show output_plugin_libraries"
          docker exec pg ls /usr/lib/postgresql/16/lib/wal2json.so
          # Teleport crea da solo i database se l'utente ha CREATEDB; li creiamo noi per chiarezza
          docker exec pg psql -U teleport -d postgres -c "create database teleport_backend" -c "create database teleport_audit"

      - name: Auth con backend Postgres (stato e audit)
        run: |
          set -e
          mkdir -p /tmp/td/sessions
          cat > /tmp/teleport.yaml <<'YAML'
          version: v3
          teleport:
            nodename: smoke
            data_dir: /tmp/td
            log:
              output: stderr
              severity: INFO
            storage:
              type: postgresql
              conn_string: postgresql://teleport:teleport@localhost:5432/teleport_backend?sslmode=disable
              audit_events_uri: ['postgresql://teleport:teleport@localhost:5432/teleport_audit?sslmode=disable']
              audit_sessions_uri: 'file:///tmp/td/sessions'
          auth_service:
            enabled: yes
            cluster_name: smoke
            listen_addr: 127.0.0.1:3025
          proxy_service:
            enabled: no
          ssh_service:
            enabled: no
          YAML
          sudo ./teleport/teleport start -c /tmp/teleport.yaml > /tmp/teleport.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            if sudo ./teleport/tctl -c /tmp/teleport.yaml status >/tmp/status.txt 2>&1; then ok=1; break; fi
            sleep 3
          done
          cat /tmp/status.txt
          test $ok = 1
          grep -q "smoke" /tmp/status.txt
          echo "--- scrittura e rilettura di una risorsa attraverso il backend"
          sudo ./teleport/tctl -c /tmp/teleport.yaml users add prova-ha --roles=access --logins=nobody || { echo "ERRORE: users add (rc=$?)"; exit 1; }
          echo "--- la scrittura e' nel database?"
          docker exec pg psql -U teleport -d teleport_backend -tAc "select count(*) from kv where convert_from(key,'UTF8') like '%prova-ha%'" | tee /tmp/user_db.txt
          # La lettura passa dalla cache dell'auth, che si aggiorna dal change feed (wal2json):
          # se la riga c'e' ma la rilettura non arriva mai, il feed non consegna.
          echo "--- rilettura attraverso la cache (fino a 30 s)"
          found=0
          for i in $(seq 1 30); do
            sudo ./teleport/tctl -c /tmp/teleport.yaml users ls > /tmp/users.txt 2>&1 || true
            if grep -q "prova-ha" /tmp/users.txt; then found=$i; break; fi
            sleep 1
          done
          cat /tmp/users.txt
          if [ "$found" = 0 ]; then
            echo "ERRORE: riga nel DB = $(cat /tmp/user_db.txt), ma prova-ha non riletto in 30 s: il change feed non consegna"
            sudo grep -E "PGBK|change feed|Change feed" /tmp/teleport.log | tail -20
            exit 1
          fi
          echo "prova-ha riletto dopo ~${found} s (riga nel DB: $(cat /tmp/user_db.txt))"
          echo "--- tabelle e righe nel backend Postgres"
          docker exec pg psql -U teleport -d teleport_backend -c '\dt'
          docker exec pg psql -U teleport -d teleport_backend -tAc 'select count(*) from kv' | tee /tmp/kv.txt
          test "$(cat /tmp/kv.txt)" -gt 0
          docker exec pg psql -U teleport -d teleport_backend -tAc "select count(*) from kv where convert_from(key,'UTF8') like '%prova-ha%'" | tee /tmp/user.txt
          test "$(cat /tmp/user.txt)" -gt 0
          echo "--- audit su Postgres"
          docker exec pg psql -U teleport -d teleport_audit -c '\dt'
          docker exec pg psql -U teleport -d teleport_audit -tAc "select count(*) from events" | tee /tmp/ev.txt
          test "$(cat /tmp/ev.txt)" -gt 0
          echo "--- change feed (logical decoding) attivo, senza errori"
          docker exec pg psql -U teleport -d teleport_backend -tAc "select slot_name, plugin, active from pg_replication_slots"
          if grep -q "Change feed stream lost" /tmp/teleport.log; then echo "ERRORE: change feed perso"; exit 1; fi
          echo "Backend Postgres (stato + change feed) e audit Postgres funzionano nella build OSS."

      - name: Log di teleport (sempre)
        if: always()
        run: sudo tail -n 80 /tmp/teleport.log || true

  release:
    needs: [build, prova-ha]
    if: ${{ always() && inputs.release && needs.prova-ha.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Scarica l'artefatto (da questo run)
        if: ${{ inputs.build_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: teleport-bin
      - name: Scarica l'artefatto (da un run precedente)
        if: ${{ inputs.build_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: teleport-bin
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: sigstore/cosign-installer@v3
      - name: Firma (keyless, OIDC di GitHub)
        run: |
          OUT="teleport-${TAG}-ss4i-${OS}-${ARCH}-bin.tar.gz"
          sha256sum -c "$OUT.sha256"
          cosign sign-blob --yes --bundle "${OUT}.sigstore.json" "${OUT}"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}-ss4i.${{ github.run_number }}
          name: Teleport ${{ inputs.tag }} (build AGPL SS4I, run ${{ github.run_number }})
          body: |
            Build dal sorgente AGPL-3.0 di `gravitational/teleport` al tag `${{ inputs.tag }}`, senza sottomodulo Enterprise, con `FIDO2=no PIV=no`.
            Provato nello stesso run: `teleport version` non Enterprise; auth avviato con backend Postgres (stato e change feed via wal2json) e audit su Postgres; un utente scritto e riletto attraverso il backend.
            Firma: `cosign verify-blob --bundle <file>.sigstore.json --certificate-identity-regexp 'github.com/ss4i/teleport-oss-build' --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>`
          files: |
            teleport-${{ inputs.tag }}-ss4i-linux-amd64-bin.tar.gz
            teleport-${{ inputs.tag }}-ss4i-linux-amd64-bin.tar.gz.sha256
            teleport-${{ inputs.tag }}-ss4i-linux-amd64-bin.tar.gz.sigstore.json
